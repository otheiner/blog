# Preview on push, publish on demand.
#
#   push to main        ->  https://<your-site>/preview/    (automatic)
#   "Run workflow"      ->  https://<your-site>/            (manual only)
#
# Both live on the same gh-pages branch: production at the root, preview in a
# /preview/ subfolder. keep_files: true stops each deploy from deleting the
# other one.
#
# ONE-TIME SETUP
#   Settings -> Pages -> Source: "Deploy from a branch"
#                        Branch: gh-pages,  folder: / (root)
#   (This replaces the "GitHub Actions" source used by actions/deploy-pages.)
#
# IF YOUR SITE IS A PROJECT SITE (username.github.io/reponame), set
# SITE_BASEURL below to "/reponame". For a user site (username.github.io),
# leave it empty.

name: Build and deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  # peaceiris pushes commits to the gh-pages branch, so it needs write.
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  SITE_BASEURL: "/blog"      # e.g. "/my-blog" for a project site; empty for a user site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build for preview
        if: github.event_name == 'push'
        # Preview lives one level down, so baseurl gains /preview.
        run: bundle exec jekyll build --baseurl "${SITE_BASEURL}/preview" --destination ./_site
        env:
          JEKYLL_ENV: preview

      - name: Build for production
        if: github.event_name == 'workflow_dispatch'
        run: bundle exec jekyll build --baseurl "${SITE_BASEURL}" --destination ./_site
        env:
          JEKYLL_ENV: production

      - name: Check the feed built correctly
        # If _plugins didn't load, the Liquid filter survives unrendered.
        # Fail here rather than shipping a broken feed to subscribers.
        run: |
          if [ ! -f ./_site/feed.xml ]; then
            echo "::error::_site/feed.xml missing - did feed.xml build?"
            exit 1
          fi
          if grep -q 'audio_file_size' ./_site/feed.xml; then
            echo "::error::Liquid filter left unrendered - _plugins did not load."
            exit 1
          fi
          echo "feed.xml built."
          grep -o '<enclosure[^>]*>' ./_site/feed.xml || echo "(no audio enclosures yet)"

      - name: Keep search engines out of the preview
        if: github.event_name == 'push'
        run: |
          printf 'User-agent: *\nDisallow: /\n' > ./_site/robots.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: ./_site

  deploy-preview:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: ./_site

      - name: Deploy to /preview/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: preview
          keep_files: true          # leave the production files at the root alone
          commit_message: "preview: ${{ github.event.head_commit.message }}"

  deploy-production:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: ./_site

      - name: Deploy to the live site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          keep_files: true          # leave /preview/ alone
          commit_message: "deploy: ${{ github.sha }}"
          # cname: yourdomain.com   # uncomment if you use a custom domain
